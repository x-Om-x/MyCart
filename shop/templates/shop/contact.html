{% extends 'shop/basic.html' %}

{% block title %} Contact Us - MyCart {% endblock %}

{% block body %} 
<div class="container my-3">
    <h3>Contact Us</h3>
<form action="/shop/contact/" method="post" > 
    {% csrf_token %}
  <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    
    <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name">
  </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email address</label>

        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email">

    </div>
    <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter your phone number">
    </div>
    <div class="mb-3">
        <label for="message" class="form-label">Describe what you want to contact us about</label>
        <textarea class="form-control" id="message" rows="3" name="message" placeholder="Enter your message"></textarea>
    </div>
    
    <button type="submit" class="btn btn-success">Submit</button>
</form>
</div>

{% endblock %}
