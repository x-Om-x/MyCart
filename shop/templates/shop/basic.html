<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>{% block title %} {% endblock %}</title>
    <style>
        {% block css %} {% endblock %} 
    </style>
    

  </head>
  <body>
    
     {% load static %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'index' %}">MyCart</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="{% url 'index' %}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'AboutUs' %}">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'Tracker' %}">Tracker</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'Contact' %}">Contact Us</a>
            </li>
           

          
          </ul>

          <form method="get" action="/shop/search/"  class="d-flex ms-lg-auto" role="search" >
            <input class="form-control me-2" type="search" placeholder="Search"
              aria-label="Search" name="search" id="search" />
            <button class="btn btn-outline-success"
              type="submit">Search</button>
          </form>
          <button type="button" class="btn btn-secondary mx-2" data-bs-html="true" data-bs-container="body" data-bs-toggle="popover" id="popcart" data-bs-placement="bottom" data-bs-content="Bottom popover">

            Cart (<span id="cart">0</span>)
          </button>
        </div>
      </div>
    </nav>
  
        
  




<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
{% block body %} {% endblock %}
{% block js %} {% endblock %}
  </body>
</html>
