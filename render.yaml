services:
  - type: web
    name: mycart
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn mc.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: mycart-db
          property: connectionString

databases:
  - name: mycart-db
    databaseName: mycart
    user: mycart
    plan: free
